---
versions:
  go: "1.24.1"

theme:
  mode: "light"

# Packages are owned by the Chezmoi profile, not by Ansible. Bootstrap
# prerequisites are the only exception.
packages:
  server:
    common:
      - git
      - zsh
      - unzip
      - curl
      - wget
      - sudo
      - tmux
      - fzf
      - ripgrep
      - jq
      - neovim
      - fd-find
      - bat
    debian: []
    redhat:
      - epel-release
  workstation:
    arch:
      - base-devel
      - sudo
      - which
      - util-linux
      - go
      - git
      - zsh
      - unzip
      - curl
      - wget
      - tmux
      - neovim
      - tree-sitter-cli
      - jq
      - direnv
      - eza
      - fd
      - fzf
      - navi
      - procs
      - ripgrep
      - dust
      - duf
      - bat
      - starship
    desktop:
      - evince
      - niri
      - wl-clipboard
      - xdg-desktop-portal
      - xdg-desktop-portal-gnome
      - argyllcms
      - colord
      - noctalia
