# Kitty configuration for Kevin Zehnder
# IosevkaTerm, TokyoNight/Solarized, Niri-friendly
# Kitty 0.46.2

# ── Font ─────────────────────────────────────────────────────────────
font_family      family="IosevkaTerm Nerd Font" style=Regular
bold_font        family="IosevkaTerm Nerd Font" style=Bold
italic_font      family="IosevkaTerm Nerd Font" style=Italic
bold_italic_font family="IosevkaTerm Nerd Font" style="Bold Italic"
font_size        13.0

# ── Theme ────────────────────────────────────────────────────────────
# Kitty uses native OS color-scheme auto switching via:
#   dark-theme.auto.conf
#   light-theme.auto.conf
#   no-preference-theme.auto.conf

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.75
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ── Window & Layout ──────────────────────────────────────────────────
# Niri handles all window decorations — strip everything
hide_window_decorations yes
window_margin_width 4
window_padding_width 12 8 12 8

# Wayland-specific
linux_display_server wayland

# ── Tab Bar ──────────────────────────────────────────────────────────
# Colors are set per-theme via Kitty's native auto theme files.
tab_bar_style powerline
tab_bar_edge top
tab_bar_min_tabs 2

# ── Scrollback ───────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 100
# Open scrollback in Neovim when using show_scrollback.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# ── Misc ─────────────────────────────────────────────────────────────
# Kitty's kittens are great — confirm on close, URL hints, Unicode input
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.2
visual_bell_color #bb9af7

# Selection / copy
copy_on_select clipboard
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#
rectangle_select_modifiers ctrl+alt

# Mouse
mouse_hide_wait 2.0
wheel_scroll_multiplier 5.0

# ── Advanced ─────────────────────────────────────────────────────────
# External control socket for live theme switching (kitten @ set-colors)
listen_on unix:/tmp/kitty

# Allow terminal programs to set window title
allow_remote_control yes
shell_integration enabled no-rc

# URL handling
detect_urls yes
url_prefixes file ftp ftps gemini git http https irc ircs kitty mailto news sftp ssh

# ── Keybindings ──────────────────────────────────────────────────────
# Kitty uses ctrl+shift+<key> conventions natively.  We layer Ghostty
# muscle-memory on top so switching back and forth is painless.

# --- Font size (match Ghostty: alt+i / alt+d) ---
map alt+i change_font_size all +2.0
map alt+d change_font_size all -2.0

# --- Tab navigation (match Ghostty: alt+ctrl+j / alt+ctrl+k) ---
map alt+ctrl+j previous_tab
map alt+ctrl+k next_tab

# --- Screen capture (match Ghostty: alt+ctrl+s → write to file) ---
map alt+ctrl+s screenshot_to_clipboard

# --- Terminal line-editing: alt+backspace → delete word back ---
# Kitty sends \x1b\x7f natively when configured correctly.
map alt+backspace send_text all \x1b\x7f

# --- New tab / close tab ---
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab

# --- New window in OS window (splits, Kitty's superpower) ---
map ctrl+shift+enter new_window
map ctrl+shift+down  neighboring_window down
map ctrl+shift+up    neighboring_window up
map ctrl+shift+right neighboring_window right
map ctrl+shift+left  neighboring_window left

# --- Paste from selection ---
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# --- Kitty kittens ---
map ctrl+shift+u kitten unicode_input
map ctrl+shift+h kitten hints

# --- Scrollback in Neovim ---
map ctrl+shift+p show_scrollback
# --- Clear terminal ---
map ctrl+shift+l clear_terminal scrollback active

# --- Reset font size ---
map ctrl+shift+0 change_font_size all 0

# ── Shell integration ────────────────────────────────────────────────
# Kitty's shell integration enables:
#   - Clickable filenames in ls/diff/git output
#   - Scrollback prompts
#   - Jump to previous/next prompt (ctrl+shift+z / ctrl+shift+x)
# Already set above: shell_integration enabled no-rc

map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
